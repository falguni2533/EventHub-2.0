<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventHub 2.0 — All Pages Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN TOKENS ===== */
:root {
  --bg-canvas: #faf9fd;
  --bg-canvas-accent: #f3effd;
  --bg-surface: #ffffff;
  --bg-surface-muted: #faf8ff;
  --sidebar-bg-start: #140b29;
  --sidebar-bg-mid: #1f1140;
  --sidebar-bg-end: #2b1759;
  --sidebar-border: rgba(196,181,253,0.16);
  --sidebar-text: #ddd6fe;
  --sidebar-text-muted: #a78bfa;
  --sidebar-hover: rgba(167,139,250,0.14);
  --sidebar-active: linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);
  --accent-primary: #6d28d9;
  --accent-secondary: #7c3aed;
  --accent-soft: #f1ecfe;
  --accent-glow: rgba(124,58,237,0.16);
  --text-primary: #1a1230;
  --text-secondary: #544b6e;
  --text-muted: #766e8f;
  --border-subtle: #ebe7f7;
  --border-strong: #d8cff5;
  --status-ok-bg: #ecfdf5; --status-ok-text: #047857; --status-ok-border: #a7f3d0;
  --status-warn-bg: #fffbeb; --status-warn-text: #b45309; --status-warn-border: #fde68a;
  --status-err-bg: #fef2f2; --status-err-text: #b91c1c; --status-err-border: #fecaca;
  --shadow-card: 0 2px 12px rgba(32,18,72,.04), 0 1px 2px rgba(32,18,72,.03);
  --shadow-card-hover: 0 10px 26px rgba(67,36,145,.09), 0 2px 6px rgba(32,18,72,.04);
  --shadow-hero: 0 12px 30px rgba(27,15,58,.15);
  --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px;
  --sidebar-width: 264px;
}
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-color:#c4b5fd transparent;scrollbar-width:thin}
body{margin:0;min-height:100dvh;font-family:'Inter',system-ui,sans-serif;color:var(--text-primary);background:var(--bg-canvas);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 92% 6%,rgba(221,214,254,.35) 0%,transparent 32%),radial-gradient(circle at 12% 94%,rgba(237,233,254,.45) 0%,transparent 38%);
}
h1,h2,h3,h4,.font-display{font-family:'Space Grotesk','Inter',system-ui,sans-serif;margin:0}
p{margin:0}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}

/* ===== APP SHELL ===== */
.app-shell{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);min-height:100dvh;width:100%}

/* ===== SIDEBAR ===== */
.sidebar{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;padding:1.25rem .9rem;color:#fff;
  background:radial-gradient(1.5px 1.5px at 22px 36px,rgba(255,255,255,.5) 50%,transparent 100%),radial-gradient(1px 1px at 185px 72px,rgba(221,214,254,.45) 50%,transparent 100%),radial-gradient(1.5px 1.5px at 78px 180px,rgba(255,255,255,.35) 50%,transparent 100%),radial-gradient(1px 1px at 220px 260px,rgba(196,181,253,.45) 50%,transparent 100%),radial-gradient(1.5px 1.5px at 45px 410px,rgba(255,255,255,.3) 50%,transparent 100%),radial-gradient(circle at 90% 10%,rgba(139,92,246,.24) 0%,transparent 45%),linear-gradient(170deg,var(--sidebar-bg-start) 0%,var(--sidebar-bg-mid) 55%,var(--sidebar-bg-end) 100%);
  border-right:1px solid var(--sidebar-border);overflow-y:auto;z-index:30}
.sidebar-brand{display:flex;align-items:center;gap:.5rem;padding:.2rem .35rem 1.1rem;border-bottom:1px solid var(--sidebar-border);margin-bottom:1.1rem}
.brand-mark{display:flex;align-items:center;gap:.72rem}
.brand-logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 6px 16px rgba(124,58,237,.4);color:#fff;flex-shrink:0}
.brand-logo svg{width:20px;height:20px}
.brand-title{font-size:1.1rem;font-weight:700;letter-spacing:-.02em}
.brand-subtitle{font-size:.7rem;color:var(--sidebar-text-muted);letter-spacing:.05em;text-transform:uppercase}
.sidebar-section-label{padding-left:.65rem;margin-bottom:.5rem;font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--sidebar-text-muted)}
.sidebar-nav{display:flex;flex-direction:column;gap:.3rem;flex:1}
.sidebar-link{display:flex;align-items:center;gap:.72rem;padding:.68rem .85rem;border-radius:var(--radius-sm);color:var(--sidebar-text);font-size:.9rem;font-weight:500;transition:background .18s,color .18s;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.sidebar-link:hover{background:var(--sidebar-hover);color:#fff}
.sidebar-link.active{background:var(--sidebar-active);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(109,40,217,.36)}
.sidebar-link svg{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{margin-top:1.15rem;padding:.85rem;border-radius:var(--radius-md);background:rgba(255,255,255,.06);border:1px solid var(--sidebar-border)}
.sidebar-footer-title{font-size:.82rem;font-weight:600}
.sidebar-footer-note{margin-top:.25rem;font-size:.74rem;color:var(--sidebar-text)}
.sidebar-logout-btn{margin-top:.75rem;width:100%;display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.52rem .75rem;border-radius:var(--radius-sm);border:1px solid rgba(221,214,254,.22);background:rgba(255,255,255,.08);color:#fff;font-size:.82rem;font-weight:600;transition:background .16s}
.sidebar-logout-btn:hover{background:rgba(167,139,250,.22)}

/* ===== TOPBAR ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 1.75rem;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle)}
.topbar-left{display:flex;align-items:center;gap:.85rem}
.topbar-breadcrumb{display:flex;align-items:center;gap:.25rem;font-size:.74rem;font-weight:500;color:var(--text-muted)}
.topbar-breadcrumb-current{color:var(--accent-primary);font-weight:600}
.topbar-title{font-size:1.15rem;font-weight:700;color:var(--text-primary)}
.topbar-right{display:flex;align-items:center;gap:.65rem}
.topbar-icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--text-secondary);transition:.15s}
.topbar-icon-btn:hover{border-color:var(--border-strong);background:var(--bg-surface-muted);color:var(--accent-primary)}
.topbar-avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:var(--accent-primary);font-family:'Space Grotesk',sans-serif;font-size:.78rem;font-weight:700}
.topbar-profile-trigger{display:flex;align-items:center;gap:.55rem;padding:.3rem .65rem .3rem .35rem;border-radius:999px;border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--text-primary)}

/* ===== WORKSPACE ===== */
.workspace-column{display:flex;flex-direction:column;min-width:0;min-height:100dvh}
.main-content{flex:1;padding:1.6rem 1.75rem 2.25rem;width:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:1.35rem}

/* ===== COSMIC HERO ===== */
.cosmic-hero{position:relative;overflow:clip;border-radius:var(--radius-lg);padding:1.65rem 1.85rem;color:#fff;
  background:radial-gradient(2px 2px at 14% 24%,rgba(255,255,255,.65) 50%,transparent 100%),radial-gradient(1.5px 1.5px at 38% 72%,rgba(221,214,254,.55) 50%,transparent 100%),radial-gradient(2px 2px at 70% 22%,rgba(255,255,255,.6) 50%,transparent 100%),radial-gradient(1.5px 1.5px at 86% 68%,rgba(196,181,253,.6) 50%,transparent 100%),radial-gradient(circle at 90% 18%,rgba(167,139,250,.28) 0%,transparent 42%),linear-gradient(130deg,#1b1035,#2f1863 60%,#4c1d95);
  box-shadow:var(--shadow-hero);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.25rem}
.cosmic-hero-badge{display:inline-flex;align-items:center;gap:.42rem;padding:.32rem .72rem;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:.74rem;font-weight:600;color:#ede9fe;margin-bottom:.65rem}
.cosmic-hero h2{font-size:1.5rem;margin-bottom:.35rem}
.cosmic-hero p{font-size:.92rem;color:rgba(255,255,255,.8);max-width:540px}
.hero-meta-chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.85rem}
.hero-meta-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .6rem;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:.74rem;color:#ede9fe}
.hero-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn-hero-ghost{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:.85rem;font-weight:600;transition:.18s}
.btn-hero-solid{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;border-radius:var(--radius-sm);border:0;background:#fff;color:var(--accent-primary);font-size:.85rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.12);transition:.18s}

/* ===== STAT CARDS ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.stat-card{display:flex;align-items:flex-start;gap:1rem;padding:1.15rem 1.25rem;border-radius:var(--radius-md);background:var(--bg-surface);border:1px solid var(--border-subtle);box-shadow:var(--shadow-card);transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover)}
.stat-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-primary);flex-shrink:0}
.stat-icon svg{width:22px;height:22px}
.stat-label{font-size:.78rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:var(--text-primary);line-height:1.2}
.stat-hint{font-size:.76rem;color:var(--text-muted);margin-top:.15rem}

/* ===== CARDS ===== */
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:1.35rem 1.5rem;box-shadow:var(--shadow-card)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.1rem;flex-wrap:wrap}
.card-title{font-size:1.05rem;font-weight:700}
.card-subtitle{font-size:.82rem;color:var(--text-muted);margin-top:.2rem}
.btn-primary{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;border-radius:var(--radius-sm);border:0;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;font-weight:600;font-size:.85rem;box-shadow:0 4px 14px rgba(109,40,217,.25);transition:.18s;cursor:pointer}
.btn-primary:hover{box-shadow:0 6px 20px rgba(109,40,217,.35);transform:translateY(-1px)}
.btn-secondary{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .85rem;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--text-secondary);font-size:.82rem;font-weight:600;transition:.15s}

/* ===== EVENT CARDS ===== */
.eh-events-grid{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.eh-event-card{background:var(--bg-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.eh-event-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-card-hover)}
.eh-event-banner{height:6rem}
.eh-event-body{padding:1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.eh-event-badge{align-self:flex-start;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;font-weight:600;color:#fff}
.eh-event-title{font-size:1.1rem;font-weight:600;margin:0}
.eh-event-desc{margin:0;font-size:.9rem;color:var(--text-secondary);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.eh-event-meta{display:flex;flex-wrap:wrap;gap:.4rem;font-size:.8rem;color:var(--text-muted)}
.eh-event-meta-item{display:flex;align-items:center;gap:.25rem}
.eh-event-seats{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
.eh-event-seats-progress{flex:1;height:6px;background:var(--border-subtle);border-radius:3px;overflow:hidden}
.eh-event-seats-fill{height:100%;background:var(--accent-primary)}
.eh-event-price-tag{padding:.2rem .5rem;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent-primary);display:inline-flex;align-items:center;gap:.2rem}
.eh-event-price-free{background:var(--status-ok-bg);color:var(--status-ok-text)}
.eh-event-view-btn{align-self:flex-start;margin-top:.5rem;padding:.4rem .85rem;border-radius:var(--radius-sm);border:1px solid var(--accent-primary);background:transparent;color:var(--accent-primary);font-weight:600;font-size:.82rem;cursor:pointer;transition:.15s}
.eh-event-view-btn:hover{background:var(--accent-primary);color:#fff}
.eh-event-view-btn.registered{background:var(--status-ok-bg);color:var(--status-ok-text);border-color:var(--status-ok-border)}

/* ===== FILTERS ===== */
.eh-events-filters{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-bottom:.5rem}
.eh-events-search{position:relative;flex:1;max-width:300px}
.eh-events-search input{width:100%;padding:.4rem .4rem .4rem 2rem;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text-primary);font:inherit}
.eh-events-categories{display:flex;flex-wrap:wrap;gap:.5rem}
.eh-events-category-chip{padding:.2rem .6rem;border-radius:999px;background:var(--bg-surface);border:1px solid var(--border-subtle);font-size:.75rem;cursor:pointer}
.eh-events-category-chip.active{background:var(--accent-primary);color:#fff;border-color:var(--accent-primary)}

/* ===== TEAM PAGE ===== */
.tp{max-width:1100px;margin:0 auto;padding:8px 4px 40px}
.tp h2{margin:28px 0 10px}.tp h3{margin:8px 0 4px}
.tp-sub{color:#6b6b80;font-size:.9rem;margin:2px 0}
.tp-why{color:#5b21b6;font-size:.88rem;margin:6px 0 10px}
.tp-tabs{display:flex;gap:8px;margin:16px 0}
.tp-tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid #ddd6fe;background:#fff;cursor:pointer;font-weight:600;font:inherit}
.tp-tabs button.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
.tp-input{width:100%;padding:10px 12px;margin:6px 0;border:1px solid #ddd6fe;border-radius:10px;box-sizing:border-box;font:inherit}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tp-card{background:#fff;border:1px solid #ede9fe;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(124,58,237,.06)}
.tp-grid .tp-card{margin:0}
.tp-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tp-badge{display:inline-block;background:#ede9fe;color:#6d28d9;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;margin-right:6px}
.tp-badge.green{background:#dcfce7;color:#15803d}
.tp-badge.amber{background:var(--status-warn-bg);color:var(--status-warn-text)}
.tp-badge.red{background:var(--status-err-bg);color:var(--status-err-text)}
.tp-btn{background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.tp-btn.ghost{background:#fff;color:#7c3aed;border:1px solid #ddd6fe}
.tp-member{padding:6px 0;border-top:1px solid #f3f0ff}
.tp-progress{height:6px;background:#ebe7f7;border-radius:3px;overflow:hidden;margin:6px 0}
.tp-progress-fill{height:100%;background:var(--accent-primary);border-radius:3px}

/* ===== COMING SOON ===== */
.coming-soon-card{text-align:center;padding:3rem 2rem;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);box-shadow:var(--shadow-card)}
.coming-soon-icon{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--accent-soft);color:var(--accent-primary);margin-bottom:1rem}
.coming-soon-card h3{font-size:1.1rem;margin-bottom:.5rem}
.coming-soon-card p{color:var(--text-muted);font-size:.88rem;max-width:460px;margin:0 auto .75rem}
.coming-soon-hint{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .7rem;border-radius:999px;background:var(--accent-soft);color:var(--accent-primary);font-size:.74rem;font-weight:600}

/* ===== QUICK ACTIONS ===== */
.quick-actions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.85rem;margin-top:1rem}
.quick-action{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.1rem .85rem;border-radius:var(--radius-md);border:1px solid var(--border-subtle);background:var(--bg-surface);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;text-align:center}
.quick-action:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover);border-color:var(--accent-primary)}
.quick-action-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent-primary)}
.quick-action-label{font-size:.85rem;font-weight:600}
.quick-action-hint{font-size:.74rem;color:var(--text-muted)}

/* ===== EVENTS PAGE GRID ===== */
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.event-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:1.1rem;box-shadow:var(--shadow-card);transition:transform .2s,box-shadow .2s}
.event-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover)}
.event-card-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem}
.event-category-pill{padding:.18rem .55rem;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--accent-soft);color:var(--accent-primary)}
.event-date-tag{font-size:.72rem;color:var(--text-muted);font-weight:500}
.event-card-title{font-size:1rem;font-weight:700;margin-bottom:.3rem}
.event-card-desc{font-size:.82rem;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event-card-meta{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.76rem;color:var(--text-muted);margin-top:.5rem}
.event-card-meta span{display:flex;align-items:center;gap:.2rem}

/* ===== DASHBOARD MAIN ===== */
.dashboard-main-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:1.35rem}
@media(max-width:900px){.dashboard-main-grid{grid-template-columns:1fr}}

/* ===== PROFILE CARD ===== */
.profile-section{display:grid;grid-template-columns:280px 1fr;gap:1.5rem}
@media(max-width:800px){.profile-section{grid-template-columns:1fr}}
.profile-avatar-card{text-align:center;padding:2rem 1.5rem;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);box-shadow:var(--shadow-card)}
.profile-avatar-big{display:inline-grid;place-items:center;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:var(--accent-primary);font-family:'Space Grotesk';font-size:1.6rem;font-weight:700;margin-bottom:.75rem}
.profile-name{font-size:1.1rem;font-weight:700}
.profile-college{font-size:.82rem;color:var(--text-muted);margin-top:.2rem}
.profile-details{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.profile-details{grid-template-columns:1fr}}
.profile-field{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:.85rem 1rem}
.profile-field-label{font-size:.72rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem}
.profile-field-value{font-size:.92rem;font-weight:600;color:var(--text-primary)}
.profile-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
.profile-chip{padding:.18rem .5rem;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--accent-soft);color:var(--accent-primary)}

/* ===== REGISTRATION CARDS ===== */
.reg-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:1.15rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;box-shadow:var(--shadow-card);transition:transform .2s}
.reg-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover)}
.reg-info h4{margin:0 0 .2rem;font-size:.95rem}
.reg-info p{font-size:.8rem;color:var(--text-muted)}
.reg-status{padding:.25rem .65rem;border-radius:999px;font-size:.72rem;font-weight:700}
.reg-status.confirmed{background:var(--status-ok-bg);color:var(--status-ok-text);border:1px solid var(--status-ok-border)}
.reg-status.pending{background:var(--status-warn-bg);color:var(--status-warn-text);border:1px solid var(--status-warn-border)}

/* ===== UTILITY ===== */

function icon(name, size=18) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

// ===== SIDEBAR NAV =====
const sidebarNav = document.getElementById('sidebarNav');
NAV.forEach((item,i) => {
  const btn = document.createElement('button');
  btn.className = 'sidebar-link' + (i===0?' active':'');
  btn.innerHTML = `${icon(item.icon)} <span>${item.label}</span>`;
  btn.onclick = () => navigateTo(item.id);
  btn.dataset.page = item.id;
  sidebarNav.appendChild(btn);
});

function navigateTo(pageId) {
  document.querySelectorAll('.sidebar-link').forEach(el => el.classList.toggle('active', el.dataset.page===pageId));
  const item = NAV.find(n=>n.id===pageId);
  document.getElementById('topbarBreadcrumb').textContent = item.label;
  document.getElementById('topbarTitle').textContent = item.label;
  renderPage(pageId);
}

// ===== PAGE RENDERERS =====
const EVENTS_DATA = [

  {title:'Cultural Night',category:'Cultural',date:'2026-12-20',venue:'Open Air Theatre',desc:'A vibrant night of dance, music, drama, and art performances by students.',capacity:800,filled:567,fee:100},
  {title:'Hackathon Sprint',category:'Technical',date:'2027-01-05',venue:'CS Lab Complex',desc:'24-hour hackathon – build innovative solutions for real-world problems.',capacity:200,filled:198,fee:0},

function renderPage(id) {
  const c = document.getElementById('pageContent');
  switch(id) {
    case 'dashboard': c.innerHTML = renderDashboard(); break;
    case 'events': c.innerHTML = renderEvents(); break;
    case 'registrations': c.innerHTML = renderRegistrations(); break;

function eventCard(e, i, registered=false) {
  const pct = Math.round((e.filled/e.capacity)*100);
  const soldOut = e.filled >= e.capacity;
  return `
    <div class="eh-event-card">
      <div class="eh-event-banner" style="background:${BANNER_COLORS[i%6]}"></div>
      <div class="eh-event-body">
        <span class="eh-event-badge" style="background:${BANNER_COLORS[i%6]}">${e.category}</span>
        <h3 class="eh-event-title">${e.title}</h3>
        <p class="eh-event-desc">${e.desc}</p>
        <div class="eh-event-meta">
          <span class="eh-event-meta-item">${icon('calendar',14)} ${e.date}</span>
          <span class="eh-event-meta-item">${icon('map-pin',14)} ${e.venue}</span>
        </div>
        <div class="eh-event-seats">
          <div class="eh-event-seats-progress"><div class="eh-event-seats-fill" style="width:${pct}%"></div></div>
          <span style="white-space:nowrap;font-size:.8rem">${e.capacity-e.filled} left</span>
        </div>
        <div style="display:flex;gap:.5rem;align-items:center;margin-top:auto">
          <span class="eh-event-price-tag ${e.fee===0?'eh-event-price-free':''}">${e.fee===0?'FREE':'₹'+e.fee}</span>
          ${soldOut?'<span style="padding:.2rem .5rem;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--status-err-bg);color:var(--status-err-text)">Sold Out</span>':''}

        <button class="eh-event-view-btn ${registered?'registered':''}" ${soldOut?'disabled':''}>${registered?'Registered ✓':soldOut?'Sold Out':'Register Now'}</button>
      </div>
    </div>
  `;
}

// ===== HELPER FUNCTIONS =====
function statCard(label,value,hint,iconName) {
  return `<div class="stat-card"><div class="stat-icon">${icon(iconName,22)}</div><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-hint">${hint}</div></div></div>`;
}
function activityItem(text,time,bg,color) {
  return `<div style="display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border-radius:var(--radius-sm);background:${bg};border:1px solid ${bg}"><div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></div><div style="flex:1;font-size:.82rem;font-weight:500;color:${color}">${text}</div><span style="font-size:.72rem;color:var(--text-muted);flex-shrink:0">${time}</span></div>`;
}
function quickAction(label,hint,iconName,page) {
  return `<div class="quick-action" onclick="navigateTo('${page}')"><div class="quick-action-icon">${icon(iconName,20)}</div><div class="quick-action-label">${label}</div><div class="quick-action-hint">${hint}</div></div>`;
}
function teamMemberCard(name,college,skills,score,looking,reason) {
  const initials = name.split(' ').map(w=>w[0]).join('');
  return `<div class="tp-card">
    <div style="background:linear-gradient(135deg,#2563eb,#1e40af);height:6px;border-radius:6px 6px 0 0;margin:-16px -16px 12px"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div class="topbar-avatar" style="width:40px;height:40px;font-size:.9rem">${initials}</div>
      <div><b>${name}</b><div class="tp-sub">${college}</div></div>
    </div>
    <span class="tp-badge">Match ${score}%</span>
    ${looking?'<span class="tp-badge green">Looking for a team</span>':''}
    <div class="profile-chips" style="margin:8px 0">${skills.split(', ').map(s=>`<span class="profile-chip">${s}</span>`).join('')}</div>
    <p class="tp-why">Why matched: ${reason}</p>
    <button class="tp-btn" style="width:100%">Send Invite</button>
  </div>`;
}
function teamCard(name,leader,filled,max,score,skills,reason) {
  return `<div class="tp-card">
    <div style="background:linear-gradient(135deg,#7c3aed,#6d28d9);height:6px;border-radius:6px 6px 0 0;margin:-16px -16px 12px"></div>
    <span class="tp-badge">Match ${score}%</span>
    <h3>${name}</h3>
    <p class="tp-sub">Leader: ${leader} • ${max-filled} spot(s) left</p>
    <div class="tp-progress"><div class="tp-progress-fill" style="width:${Math.round(filled/max*100)}%"></div></div>
    <p class="tp-sub">${filled}/${max} members</p>
    <div class="profile-chips" style="margin:6px 0">${skills.split(', ').map(s=>`<span class="profile-chip">${s}</span>`).join('')}</div>
    <p class="tp-why">Why matched: ${reason}</p>
    <button class="tp-btn" style="width:100%">Request to Join</button>
  </div>`;
}

function switchTab(tab) {
  document.getElementById('tabLeader').className = tab==='leader'?'on':'';
  document.getElementById('tabSolo').className = tab==='solo'?'on':'';
  document.getElementById('tabLeaderContent').style.display = tab==='leader'?'':'none';
  document.getElementById('tabSoloContent').style.display = tab==='solo'?'':'none';
}
